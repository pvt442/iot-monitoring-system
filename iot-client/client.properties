# ============================================================
#  IoT Client Simulator - cấu hình (T2.2)
#  Sửa file này, KHÔNG cần sửa mã nguồn.
#  Có thể ghi đè bằng tham số dòng lệnh, ví dụ:
#     --server=http://192.168.1.10:8080 --interval=3000 --devices=DEV_01,DEV_02
# ============================================================

# Địa chỉ IoT Data Server (Spring Boot)
server.url=http://localhost:8080

# Chu kỳ gửi dữ liệu của mỗi thiết bị (mili-giây). Khuyến nghị 2000 - 5000.
send.interval.ms=3000

# Thời gian tối đa chờ phản hồi từ Server (mili-giây)
http.timeout.ms=5000

# RANDOM: sinh ngẫu nhiên kiểu "random walk" quanh giá trị gốc
# CSV   : đọc lần lượt từng dòng "nhiệt_độ,độ_ẩm" từ csv.file rồi lặp lại
mode=RANDOM
csv.file=data/sample.csv

# Tự đăng ký thiết bị lên Server (POST /api/devices) khi khởi động hoặc khi Server báo chưa có
auto.register=true

# Danh sách thiết bị mô phỏng (mỗi thiết bị chạy một luồng riêng)
devices=DEV_01,DEV_02,DEV_03

device.DEV_01.name=Cảm biến phòng máy chủ
device.DEV_01.location=Phòng máy chủ A
device.DEV_01.baseTemp=27.0
device.DEV_01.baseHum=62.0

device.DEV_02.name=Cảm biến kho lạnh
device.DEV_02.location=Kho lạnh tầng 1
device.DEV_02.baseTemp=22.0
device.DEV_02.baseHum=70.0

device.DEV_03.name=Cảm biến phòng thí nghiệm
device.DEV_03.location=Phòng thí nghiệm B2
device.DEV_03.baseTemp=25.0
device.DEV_03.baseHum=55.0
