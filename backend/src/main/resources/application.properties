# ============================================================
#  IoT Data Server - cấu hình Backend
#  KHÔNG ghi mật khẩu thật vào file này / không đẩy lên GitHub.
#  Đặt biến môi trường DB_PASSWORD (hoặc tạo application-local.properties,
#  file này đã được .gitignore bỏ qua - xem application-local.properties.example).
# ============================================================
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iot_monitoring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# init.sql là cách chuẩn để tạo schema; "update" chỉ bổ sung cột/bảng còn thiếu khi chạy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Tự đăng ký thiết bị khi nhận dữ liệu từ Device ID chưa tồn tại (mặc định tắt: phải POST /api/devices trước).
iot.auto-register-devices=false

# Cho phép file cấu hình cục bộ (không đưa lên git) ghi đè giá trị ở trên
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties
